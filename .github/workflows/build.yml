name: CI/CD React App

# Permissions: Limit for security
permissions:
  contents: read
  actions: write  # For badges

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent hang
    steps:
      - name: Checkout code  # Always first
        uses: actions/checkout@v4  # Pin version

      - name: Setup Node.js with cache  # Cache deps for speed
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'  # Explicit path

      - name: Install dependencies  # Clean install
        run: npm ci

      - name: Build app  # Production build
        run: npm run build

      - name: List build output  # Debug: Check files
        run: ls -la build/

  test-and-lint:  # CI: Test & Lint with matrix
    needs: build  # Sequential: After build
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Longer for matrix
    strategy:
      fail-fast: false  # Don't stop if one fails
      matrix:
        node-version: [16.x, 18.x, 20.x]  # Parallel test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code  # Style check
        run: npm run lint

      - name: Run tests with coverage  # Unit test
        run: npm run test:ci

      - name: Upload coverage report  # Artifact for review
        if: always()  # Upload even if fail
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7  # Keep 7 days

  deploy:  # CD: Deploy Vercel (production only)
    needs: test-and-lint  # After CI pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only main
    environment: production  # Approval gate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Deploy to Vercel  # Secure with secrets
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'